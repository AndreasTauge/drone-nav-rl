[project]
name = "drone-nav"
version = "0.1.0"
description = "Learned drone navigation: PPO in MuJoCo/MJX, exported to ONNX, flown in ROS 2 + PX4 SITL"
readme = "README.md"
license = "MIT"
authors = [{ name = "Andreas Tauge" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Simulation
    "mujoco>=4.0.1,<4.1",
    "mujoco-mjx>=4.0.1,<4.1",
    # JAX: CUDA 13 wheels on Linux (driver 595 / CUDA 13.2); CPU/Metal-free JAX on macOS
    "jax[cuda13]>=0.12.1,<0.13; sys_platform == 'linux'",
    "jax>=0.12.1,<0.13; sys_platform != 'linux'",
    # RL: Brax PPO (JAX-native, trains directly on MJX environments)
    "brax>=0.14.2,<0.15",
    # Export
    "onnx>=1.23,<2",
    "onnxruntime>=1.32,<2",
    # Utilities
    "numpy>=2.0",
    "pyyaml>=6.0",
    "mediapy>=1.2",
]

[project.optional-dependencies]
logging = [
    "tensorboard>=2.21",
    "wandb>=0.31",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drone_nav"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a CUDA GPU visible to JAX"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
